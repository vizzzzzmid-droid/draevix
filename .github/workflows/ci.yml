name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Check deployment script
        run: bash -n .github/scripts/deploy-draevix.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun format:check

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun check-types

      - name: Dead code audit
        run: bun run knip

      - name: Run tests
        run: bun run test

      - name: Build
        working-directory: apps/server
        run: bun run build

      - name: Upload deployment binary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: draevix-linux-x64
          path: apps/server/build/out/draevix-linux-x64
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment binary
        uses: actions/download-artifact@v4
        with:
          name: draevix-linux-x64
          path: deploy

      - name: Configure SSH
        env:
          SERVER_DEPLOY_KEY: ${{ secrets.SERVER_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 .github/known_hosts ~/.ssh/known_hosts
          printf '%s\n' "$SERVER_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload binary
        run: >-
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -i ~/.ssh/id_ed25519 deploy/draevix-linux-x64
          draevix-deploy@163.5.16.200:/home/draevix-deploy/draevix-linux-x64

      - name: Activate deployment
        run: >-
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -i ~/.ssh/id_ed25519 draevix-deploy@163.5.16.200
          sudo /usr/local/sbin/deploy-draevix
