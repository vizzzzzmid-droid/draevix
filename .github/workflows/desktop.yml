name: desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build web client
        run: bun --filter client build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v2
        with:
          projectPath: apps/desktop
          args: --bundles ${{ matrix.bundles }}
