name: desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build web client
        run: bun --filter client build

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Tag pushes (desktop-v*) publish a real GitHub release with signed
      # updater bundles + latest.json, so installed apps self-update.
      # Manual runs only produce downloadable artifacts.
      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: 'Draevix Desktop v__VERSION__'
          releaseDraft: ${{ github.ref_type != 'tag' }}
          args: --bundles ${{ matrix.bundles }}

      - name: Upload installers
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: draevix-desktop-${{ matrix.bundles }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/
            apps/desktop/src-tauri/target/release/bundle/appimage/
            apps/desktop/src-tauri/target/release/bundle/deb/
            apps/desktop/src-tauri/target/release/bundle/msi/
          if-no-files-found: error
